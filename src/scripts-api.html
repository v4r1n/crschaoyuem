<script>
(function (global) {
  'use strict';

  class ClientApiError extends Error {
    constructor(error, requestId) {
      const source = error || {};
      super(source.message || 'ไม่สามารถดำเนินการได้ กรุณาลองใหม่อีกครั้ง');
      this.name = 'ClientApiError';
      this.code = source.code || 'INTERNAL';
      this.fieldErrors = source.fieldErrors || null;
      this.retryable = source.retryable !== false;
      this.requestId = requestId || '';
    }
  }

  const authState = {
    sessionToken: '',
    initialized: false,
    attempt: null,
    generation: 0,
    sessionPromise: null,
    sessionResolve: null,
    sessionReject: null
  };

  function showGoogleSignIn(message) {
    const splash = document.querySelector('#app-splash');
    const shell = document.querySelector('#app-shell');
    const access = document.querySelector('#access-state');
    if (splash) splash.hidden = true;
    if (shell) shell.hidden = true;
    if (access) access.hidden = false;
    const title = access && access.querySelector('[data-access-title]');
    const detail = access && access.querySelector('[data-access-message]');
    const requestId = access && access.querySelector('[data-access-request-id]');
    if (title) title.textContent = 'ลงชื่อเข้าใช้ด้วย Google';
    if (detail) detail.textContent = message ||
      'เลือกบัญชี Google ที่ได้รับอนุญาตให้ใช้ระบบ';
    if (requestId) requestId.textContent = '';
    setSignInBusy(false);
  }

  function setSignInBusy(busy) {
    const button = document.querySelector('#google-signin-button');
    const label = button && button.querySelector('[data-auth-button-label]');
    if (button) {
      button.disabled = Boolean(busy);
      button.setAttribute('aria-busy', busy ? 'true' : 'false');
    }
    if (label) label.textContent = busy ? 'กำลังเชื่อมต่อกับ Google…' : 'ลงชื่อเข้าใช้ด้วย Google';
  }

  function initializeServerOAuth() {
    if (authState.initialized) return;
    const button = document.querySelector('#google-signin-button');
    if (!button) return;
    button.addEventListener('click', startOAuthSignIn);
    document.querySelector('#oauth-handoff-submit').addEventListener('click', function () {
      if (!authState.attempt) return;
      const input = document.querySelector('#oauth-handoff-input');
      const code = input.value.trim();
      if (!/^confirm1_[A-Za-z0-9_-]{43}$/.test(code)) {
        input.setCustomValidity('กรุณาวางรหัสยืนยันให้ครบถ้วน');
        input.reportValidity();
        return;
      }
      input.setCustomValidity('');
      authState.attempt.handoffCode = code;
      input.value = '';
    });
    authState.initialized = true;
  }

  function serverRpc(method, args) {
    return new Promise(function (resolve, reject) {
      if (!global.google || !google.script || !google.script.run) {
        reject(new ClientApiError({
          code: 'CLIENT_ENVIRONMENT',
          message: 'กรุณาเปิดระบบผ่านลิงก์ Web app ขององค์กร',
          retryable: false
        }));
        return;
      }
      const runner = google.script.run
        .withSuccessHandler(function (response) {
          if (response && response.ok === true) {
            resolve(response.data);
            return;
          }
          reject(new ClientApiError(
            response && response.error,
            response && response.meta && response.meta.requestId
          ));
        })
        .withFailureHandler(function (error) {
          console.error('google.script.run transport failure');
          reject(new ClientApiError({
            code: 'TRANSPORT_ERROR',
            message: 'เชื่อมต่อระบบไม่สำเร็จ กรุณาตรวจอินเทอร์เน็ตแล้วลองใหม่',
            retryable: true
          }));
        });
      try {
        runner[method].apply(runner, args || []);
      } catch (error) {
        reject(new ClientApiError({
          code: 'CLIENT_ERROR',
          message: 'ไม่สามารถส่งคำขอไปยังระบบได้ กรุณาลองใหม่',
          retryable: true
        }));
      }
    });
  }

  function randomBrowserSecret(prefix) {
    if (!global.crypto || typeof global.crypto.getRandomValues !== 'function') {
      throw new ClientApiError({
        code: 'CLIENT_SECURITY_UNAVAILABLE',
        message: 'เบราว์เซอร์นี้ไม่รองรับการลงชื่อเข้าใช้อย่างปลอดภัย กรุณาอัปเดตเบราว์เซอร์',
        retryable: false
      });
    }
    const bytes = new Uint8Array(32);
    global.crypto.getRandomValues(bytes);
    let binary = '';
    bytes.forEach(function (byte) { binary += String.fromCharCode(byte); });
    return prefix + global.btoa(binary)
      .replace(/\+/g, '-')
      .replace(/\//g, '_')
      .replace(/=+$/, '');
  }

  async function sha256BrowserSecret(value) {
    if (!global.crypto || !global.crypto.subtle || typeof global.crypto.subtle.digest !== 'function' ||
      typeof global.TextEncoder !== 'function') {
      throw new ClientApiError({
        code: 'CLIENT_SECURITY_UNAVAILABLE',
        message: 'เบราว์เซอร์นี้ไม่รองรับการลงชื่อเข้าใช้อย่างปลอดภัย กรุณาอัปเดตเบราว์เซอร์',
        retryable: false
      });
    }
    const digest = await global.crypto.subtle.digest(
      'SHA-256',
      new global.TextEncoder().encode(String(value))
    );
    let binary = '';
    new Uint8Array(digest).forEach(function (byte) { binary += String.fromCharCode(byte); });
    return global.btoa(binary)
      .replace(/\+/g, '-')
      .replace(/\//g, '_')
      .replace(/=+$/, '');
  }

  function validateAuthorizationStart(value) {
    const start = value && typeof value === 'object' ? value : {};
    const flowId = String(start.flowId || '');
    const authorizationUrl = String(start.authorizationUrl || '');
    const expiresAt = Number(start.expiresAt);
    let parsed;
    try { parsed = new URL(authorizationUrl); }
    catch (error) { parsed = null; }
    const forbiddenParameters = parsed && [
      'access_token', 'id_token', 'refresh_token', 'session_token'
    ].some(function (name) { return parsed.searchParams.has(name); });
    if (!/^flow1_[A-Za-z0-9_-]{43}$/.test(flowId) ||
      !Number.isInteger(expiresAt) || expiresAt <= Math.floor(Date.now() / 1000) ||
      !parsed || parsed.origin !== 'https://accounts.google.com' ||
      parsed.pathname !== '/o/oauth2/v2/auth' || !parsed.searchParams.get('state') ||
      forbiddenParameters) {
      throw new ClientApiError({
        code: 'AUTH_PROTOCOL_ERROR',
        message: 'ระบบส่งข้อมูลเริ่มต้นการลงชื่อเข้าใช้ไม่ถูกต้อง กรุณาติดต่อผู้ดูแลระบบ',
        retryable: false
      });
    }
    return { flowId: flowId, authorizationUrl: authorizationUrl, expiresAt: expiresAt };
  }

  function sessionWaiter() {
    if (authState.sessionToken) return Promise.resolve(authState.sessionToken);
    if (!authState.sessionPromise) {
      authState.sessionPromise = new Promise(function (resolve, reject) {
        authState.sessionResolve = resolve;
        authState.sessionReject = reject;
      });
    }
    return authState.sessionPromise;
  }

  function settleSessionWaiter(error, sessionToken) {
    const resolve = authState.sessionResolve;
    const reject = authState.sessionReject;
    authState.sessionPromise = null;
    authState.sessionResolve = null;
    authState.sessionReject = null;
    if (error && reject) reject(error);
    else if (!error && resolve) resolve(sessionToken);
  }

  function delay(milliseconds) {
    return new Promise(function (resolve) { global.setTimeout(resolve, milliseconds); });
  }

  async function pollOAuthAttempt(attempt) {
    let closedAt = 0;
    while (authState.attempt === attempt && authState.generation === attempt.generation) {
      if (Math.floor(Date.now() / 1000) >= attempt.expiresAt) {
        throw new ClientApiError({
          code: 'UNAUTHENTICATED',
          message: 'คำขอลงชื่อเข้าใช้หมดอายุแล้ว กรุณาลองใหม่',
          retryable: true
        });
      }
      if (attempt.popup.closed && document.querySelector('#oauth-handoff-panel').hidden) {
        if (!closedAt) closedAt = Date.now();
        if (Date.now() - closedAt > 1500) {
          throw new ClientApiError({
            code: 'AUTH_CANCELLED',
            message: 'หน้าต่างลงชื่อเข้าใช้ถูกปิด กรุณาลองใหม่',
            retryable: true
          });
        }
      }
      const handoff = attempt.handoffCode || '';
      attempt.handoffCode = '';
      const result = await serverRpc('completeOAuthSignIn',
        [attempt.flowId, attempt.pollToken, handoff, handoff ? attempt.sessionToken : '']);
      if (result && result.status === 'AWAITING_CONFIRMATION') {
        const panel = document.querySelector('#oauth-handoff-panel');
        if (panel) panel.hidden = false;
        await delay(750);
        continue;
      }
      if (result && result.status === 'COMPLETE') return;
      if (!result || result.status !== 'PENDING') {
        throw new ClientApiError({
          code: 'AUTH_PROTOCOL_ERROR',
          message: 'สถานะการลงชื่อเข้าใช้ไม่ถูกต้อง กรุณาลองใหม่',
          retryable: true
        });
      }
      await delay(750);
    }
    throw new ClientApiError({
      code: 'AUTH_CANCELLED',
      message: 'คำขอลงชื่อเข้าใช้ถูกยกเลิก',
      retryable: true
    });
  }

  async function startOAuthSignIn() {
    if (authState.sessionToken || authState.attempt) return;
    const popup = global.open('', 'crs-google-oauth',
      'popup=yes,width=520,height=720,resizable=yes,scrollbars=yes');
    if (!popup) {
      const blocked = new ClientApiError({
        code: 'POPUP_BLOCKED',
        message: 'เบราว์เซอร์บล็อกหน้าต่างลงชื่อเข้าใช้ กรุณาอนุญาต popup แล้วลองใหม่',
        retryable: true
      });
      showGoogleSignIn(blocked.message);
      settleSessionWaiter(blocked);
      return;
    }

    const generation = ++authState.generation;
    const attempt = {
      generation: generation,
      popup: popup,
      pollToken: '',
      sessionToken: '',
      flowId: '',
      expiresAt: 0
    };
    authState.attempt = attempt;
    document.querySelector('#oauth-handoff-panel').hidden = true;
    document.querySelector('#oauth-handoff-input').value = '';
    setSignInBusy(true);

    try {
      try {
        popup.document.title = 'กำลังเชื่อมต่อกับ Google';
        popup.document.body.textContent = 'กำลังเตรียมหน้าลงชื่อเข้าใช้…';
        popup.opener = null;
      } catch (ignored) { /* The popup will navigate immediately. */ }

      attempt.pollToken = randomBrowserSecret('poll1_');
      attempt.sessionToken = randomBrowserSecret('session1_');
      const hashes = await Promise.all([
        sha256BrowserSecret(attempt.pollToken),
        sha256BrowserSecret(attempt.sessionToken)
      ]);
      const start = validateAuthorizationStart(await serverRpc('beginOAuthSignIn', [{
        pollTokenHash: hashes[0],
        sessionTokenHash: hashes[1]
      }]));
      if (authState.attempt !== attempt || generation !== authState.generation) return;
      attempt.flowId = start.flowId;
      attempt.expiresAt = start.expiresAt;
      popup.location.replace(start.authorizationUrl);
      await pollOAuthAttempt(attempt);
      if (authState.attempt !== attempt || generation !== authState.generation) return;
      const hadSessionWaiter = Boolean(authState.sessionResolve);
      authState.sessionToken = attempt.sessionToken;
      settleSessionWaiter(null, authState.sessionToken);
      if (!hadSessionWaiter) {
        global.dispatchEvent(new CustomEvent('crs:authentication-required'));
      }
    } catch (error) {
      const normalized = error instanceof ClientApiError ? error : new ClientApiError({
        code: 'AUTH_CLIENT_ERROR',
        message: 'ลงชื่อเข้าใช้ไม่สำเร็จ กรุณาลองใหม่',
        retryable: true
      });
      if (authState.attempt === attempt && generation === authState.generation) {
        showGoogleSignIn(normalized.message);
        settleSessionWaiter(normalized);
      }
    } finally {
      if (authState.attempt === attempt && generation === authState.generation) {
        authState.attempt = null;
        document.querySelector('#oauth-handoff-panel').hidden = true;
        setSignInBusy(false);
      }
      try { if (!popup.closed) popup.close(); }
      catch (ignored) { /* Cross-origin popup close is best-effort. */ }
    }
  }

  function getSessionToken() {
    if (authState.sessionToken) return Promise.resolve(authState.sessionToken);
    initializeServerOAuth();
    showGoogleSignIn();
    return sessionWaiter();
  }

  function clearSessionToken(expectedToken) {
    if (expectedToken && authState.sessionToken !== expectedToken) return false;
    authState.sessionToken = '';
    return true;
  }

  async function signOut() {
    const token = authState.sessionToken;
    const activeAttempt = authState.attempt;
    clearSessionToken(token);
    authState.generation += 1;
    authState.attempt = null;
    try {
      if (activeAttempt && activeAttempt.popup && !activeAttempt.popup.closed) {
        activeAttempt.popup.close();
      }
    } catch (ignored) { /* Popup cleanup is best-effort. */ }
    if (token) {
      try { await serverRpc('logoutSession', [token]); }
      catch (error) { console.warn('Server session logout failed closed', error); }
    }
    global.dispatchEvent(new CustomEvent('crs:authentication-required'));
  }

  async function invoke(method, args) {
    const sessionToken = await getSessionToken();
    try {
      return await serverRpc(method, [sessionToken].concat(args || []));
    } catch (error) {
      const identityRejected = error && (error.code === 'UNAUTHENTICATED' ||
        error.code === 'USER_DISABLED' ||
        (method === 'getAppBootstrap' &&
          error.code === 'FORBIDDEN'));
      if (identityRejected) {
        const clearedCurrentToken = clearSessionToken(sessionToken);
        if (clearedCurrentToken && method !== 'getAppBootstrap') {
          global.dispatchEvent(new CustomEvent('crs:authentication-required'));
        }
      }
      throw error;
    }
  }

  function endpoint(method) {
    return function () {
      return invoke(method, Array.prototype.slice.call(arguments));
    };
  }

  document.addEventListener('DOMContentLoaded', initializeServerOAuth);

  global.CRS = global.CRS || {};
  global.CRS.ClientApiError = ClientApiError;
  global.CRS.auth = Object.freeze({
    getSessionToken: getSessionToken,
    clearSessionToken: clearSessionToken,
    showGoogleSignIn: showGoogleSignIn,
    signOut: signOut
  });
  global.CRS.api = Object.freeze({
    getAppBootstrap: endpoint('getAppBootstrap'),
    getDashboard: endpoint('getDashboard'),
    listEquipment: endpoint('listEquipment'),
    getEquipmentDetail: endpoint('getEquipmentDetail'),
    listCategories: endpoint('listCategories'),
    createBorrowRequest: endpoint('createBorrowRequest'),
    listMyBorrowing: endpoint('listMyBorrowing'),
    getBorrowDetail: endpoint('getBorrowDetail'),
    requestReturn: endpoint('requestReturn'),
    listMyHistory: endpoint('listMyHistory'),
    adminGetDashboard: endpoint('adminGetDashboard'),
    adminListBorrowing: endpoint('adminListBorrowing'),
    adminApproveBorrow: endpoint('adminApproveBorrow'),
    adminRejectBorrow: endpoint('adminRejectBorrow'),
    adminCheckoutBorrow: endpoint('adminCheckoutBorrow'),
    adminCompleteReturn: endpoint('adminCompleteReturn'),
    adminCreateEquipment: endpoint('adminCreateEquipment'),
    adminUpdateEquipment: endpoint('adminUpdateEquipment'),
    adminChangeEquipmentStatus: endpoint('adminChangeEquipmentStatus'),
    adminUploadEquipmentImage: endpoint('adminUploadEquipmentImage'),
    adminListUsers: endpoint('adminListUsers'),
    adminCreateUser: endpoint('adminCreateUser'),
    adminUpdateUser: endpoint('adminUpdateUser'),
    adminListCategories: endpoint('adminListCategories'),
    adminCreateCategory: endpoint('adminCreateCategory'),
    adminUpdateCategory: endpoint('adminUpdateCategory'),
    adminListHistory: endpoint('adminListHistory'),
    adminRunIntegrityAudit: endpoint('adminRunIntegrityAudit'),
    adminListOperations: endpoint('adminListOperations'),
    adminGetOperationDetail: endpoint('adminGetOperationDetail'),
    adminReconcileOperation: endpoint('adminReconcileOperation'),
    adminAbortOperation: endpoint('adminAbortOperation')
  });
})(window);
</script>
